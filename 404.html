<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Page Not Found</title>
  <link rel="icon" type="image/x-icon" href="icon.png">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #1e1e1e;
      color: #eaeaea;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      text-align: center;
      max-width: 600px;
      padding: 40px;
    }

    .box {
      background: #2a2a2a;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0,0,0,0.4);
    }

    .code {
      font-size: 6rem;
      font-weight: bold;
      color: #4caf50;
      margin: 0;
      line-height: 1;
    }

    h1 {
      margin: 10px 0 20px 0;
      font-size: 2rem;
      color: #ffffff;
    }

    p {
      color: #aaa;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    a.button {
      display: inline-block;
      background: #4caf50;
      color: #fff;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: bold;
      transition: 0.2s ease;
    }

    a.button:hover {
      background: #45a049;
      transform: translateY(-2px);
    }

    .glow {
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(76,175,80,0.08) 0%, rgba(0,0,0,0) 70%);
      z-index: -1;
    }
  </style>
</head>

<body>

  <div class="glow"></div>

  <div class="container">
    <div class="box">
      <div class="code">404</div>
      <h1>Page Not Found</h1>
      <p>
        Oops! It seems the changelog or page you are looking for has been moved,
        deleted, or never existed.
      </p>

      <a class="button" href="/changelogs/">
        Return to homepage
      </a>
    </div>
  </div>

</body>
</html>
