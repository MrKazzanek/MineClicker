<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minecraft Clicker - {{VERSION}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d0f14;
      --bg-card:   #12151e;
      --border:    #1f2435;
      --accent:    #7c3aed;
      --accent-hi: #a855f7;
      --accent-glow: rgba(124,58,237,.35);
      --text:      #e2e8f0;
      --muted:     #64748b;
      --muted-hi:  #94a3b8;
      --tag-bg:    rgba(124,58,237,.15);
      --tag-text:  #c4b5fd;
    }

    html { scroll-behavior: smooth; }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 15px; line-height: 1.7; min-height: 100vh;
    }

    /* ─── HEADER ─────────────────────────────── */
    header {
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 100;
      background: rgba(13,15,20,.85);
      backdrop-filter: blur(12px);
    }
    .header-inner {
      max-width: 860px; margin: 0 auto; padding: 0 24px;
      height: 60px; display: flex; align-items: center; justify-content: space-between;
    }
    .logo {
      font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 1.1rem;
      color: var(--text); text-decoration: none; display: flex; align-items: center; gap: 10px;
    }
    .logo-dot { width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent); }
    .back-link {
      font-family:'JetBrains Mono',monospace; font-size:.78rem; color:var(--muted);
      text-decoration:none; transition:color .2s; display:flex;align-items:center;gap:6px;
    }
    .back-link:hover { color: var(--text); }

    /* ─── HERO IMAGE ──────────────────────────── */
    .hero-image-wrap {
      width: 100%; max-height: 420px; overflow: hidden;
      border-bottom: 1px solid var(--border);
    }
    .hero-image-wrap img {
      width: 100%; height: 420px; object-fit: cover; display: block;
      opacity: .85;
    }
    .hero-gradient {
      background: linear-gradient(135deg, #1a1028 0%, #0d0f14 100%);
      height: 220px;
      display: flex; align-items: center; justify-content: center;
      border-bottom: 1px solid var(--border);
    }
    .hero-gradient-inner {
      font-family: 'JetBrains Mono', monospace;
      font-size: 4rem; font-weight: 600;
      color: var(--accent); opacity: .2;
      user-select: none;
    }

    /* ─── ARTICLE ─────────────────────────────── */
    article {
      max-width: 720px; margin: 0 auto;
      padding: 48px 24px 96px;
    }

    /* meta bar */
    .article-meta {
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      margin-bottom: 28px;
    }
    .art-version {
      font-family: 'JetBrains Mono', monospace; font-size: .9rem; font-weight: 600;
      color: var(--accent-hi); background: var(--tag-bg); padding: 4px 12px; border-radius: 6px;
    }
    .art-date {
      font-family: 'JetBrains Mono', monospace; font-size: .8rem; color: var(--muted);
    }
    .tag {
      font-size: .72rem; padding: 3px 8px; border-radius: 4px; font-weight: 500;
    }
    .tag-fix    { background:rgba(239,68,68,.15); color:#fca5a5; }
    .tag-feat   { background:rgba(16,185,129,.15);color:#6ee7b7; }
    .tag-perf   { background:rgba(245,158,11,.15);color:#fcd34d; }
    .tag-break  { background:rgba(239,68,68,.25); color:#f87171; }
    .tag-patch  { background:rgba(100,116,139,.2);color:#94a3b8; }

    .article-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(1.6rem, 4vw, 2.4rem); font-weight: 700;
      line-height: 1.15; letter-spacing: -.02em;
      margin-bottom: 10px;
    }
    .article-excerpt {
      color: var(--muted-hi); font-size: 1.05rem; margin-bottom: 36px;
      border-left: 3px solid var(--accent); padding-left: 16px;
    }

    /* ─── CONTENT STYLES ──────────────────────── */
    .cl-content h2 {
      font-family:'Space Grotesk',sans-serif; font-size:1.25rem; font-weight:600;
      margin: 40px 0 14px; color:var(--text);
      display:flex; align-items:center; gap:10px;
    }
    .cl-content h2::before {
      content:'#'; font-family:'JetBrains Mono',monospace; font-size:.8rem;
      color:var(--accent); opacity:.7;
    }
    .cl-content h3 {
      font-family:'Space Grotesk',sans-serif; font-size:1rem; font-weight:600;
      margin:28px 0 10px; color:var(--muted-hi);
    }
    .cl-content p { margin-bottom:14px; color:var(--muted-hi); }
    .cl-content p:last-child { margin-bottom: 0; }

    .cl-content ul, .cl-content ol {
      margin: 0 0 16px 0; padding-left: 0; list-style: none;
    }
    .cl-content li {
      position:relative; padding: 5px 0 5px 22px; color:var(--muted-hi);
    }
    .cl-content ul li::before {
      content:'→'; position:absolute; left:0;
      color:var(--accent); font-size:.85rem;
    }
    .cl-content ol { counter-reset:item; }
    .cl-content ol li::before {
      counter-increment:item; content:counter(item)'.';
      position:absolute; left:0; color:var(--accent);
      font-family:'JetBrains Mono',monospace; font-size:.78rem; top:7px;
    }

    .cl-content code {
      font-family:'JetBrains Mono',monospace; font-size:.82rem;
      background:rgba(124,58,237,.15); color:var(--accent-hi);
      padding:1px 6px; border-radius:4px;
    }
    .cl-content pre {
      background:var(--bg-card); border:1px solid var(--border);
      border-radius:8px; padding:18px 20px; overflow-x:auto;
      margin:16px 0;
    }
    .cl-content pre code { background:none; padding:0; color:var(--muted-hi); }

    /* sekcja zmiany (kolorowe bloki) */
    .change-block {
      border-left: 3px solid;
      padding: 12px 16px; border-radius: 0 8px 8px 0;
      background: rgba(255,255,255,.02);
      margin: 8px 0;
    }
    .change-block.feat  { border-color:#10b981; }
    .change-block.fix   { border-color:#ef4444; }
    .change-block.perf  { border-color:#f59e0b; }
    .change-block.break { border-color:#dc2626; }
    .change-block.info  { border-color:#7c3aed; }
    .change-block .cb-label {
      font-family:'JetBrains Mono',monospace; font-size:.7rem; font-weight:600;
      letter-spacing:.08em; text-transform:uppercase; margin-bottom:4px;
    }
    .change-block.feat  .cb-label { color:#6ee7b7; }
    .change-block.fix   .cb-label { color:#fca5a5; }
    .change-block.perf  .cb-label { color:#fcd34d; }
    .change-block.break .cb-label { color:#f87171; }
    .change-block.info  .cb-label { color:var(--accent-hi); }
    .change-block p { margin:0; font-size:.9rem; }

    /* obrazki */
    .cl-content img {
      max-width:100%; border-radius:10px; border:1px solid var(--border);
      display:block; margin:20px 0;
    }
    .img-caption {
      font-size:.8rem; color:var(--muted); text-align:center; margin-top:-12px; margin-bottom:20px;
    }

    /* tabela */
    .cl-content table {
      width:100%; border-collapse:collapse; margin:16px 0; font-size:.88rem;
    }
    .cl-content th {
      text-align:left; padding:10px 14px;
      font-family:'JetBrains Mono',monospace; font-size:.75rem; font-weight:600;
      color:var(--accent-hi); text-transform:uppercase; letter-spacing:.05em;
      border-bottom:1px solid var(--border);
    }
    .cl-content td { padding:10px 14px; border-bottom:1px solid rgba(31,36,53,.5); color:var(--muted-hi); }
    .cl-content tr:last-child td { border-bottom:none; }
    .cl-content tr:hover td { background:rgba(255,255,255,.025); }

    /* callout */
    .callout {
      background:var(--bg-card); border:1px solid var(--border);
      border-radius:10px; padding:16px 20px; margin:20px 0;
      display:flex; gap:12px; align-items:flex-start;
    }
    .callout-icon { font-size:1.1rem; flex-shrink:0; margin-top:1px; }
    .callout p { margin:0; font-size:.9rem; }

    /* separator */
    .cl-content hr {
      border:none; border-top:1px solid var(--border);
      margin:36px 0;
    }

    /* ─── NAWIGACJA MIĘDZY WERSJAMI ──────────── */
    .version-nav {
      display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap;
      margin-top:64px; padding-top:32px; border-top:1px solid var(--border);
    }
    .ver-btn {
      flex:1; min-width:160px;
      padding:14px 18px; border-radius:10px;
      background:var(--bg-card); border:1px solid var(--border);
      color:var(--text); text-decoration:none;
      transition:border-color .2s, box-shadow .2s;
      font-size:.85rem;
    }
    .ver-btn:hover { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent-glow); }
    .ver-btn .vb-label {
      font-family:'JetBrains Mono',monospace; font-size:.7rem; color:var(--muted);
      margin-bottom:4px; display:block;
    }
    .ver-btn .vb-ver { font-family:'JetBrains Mono',monospace; color:var(--accent-hi); }
    .ver-btn .vb-title { color:var(--muted-hi); }
    .ver-btn.next { text-align:right; }

    /* ─── FOOTER ─────────────────────────────── */
    footer {
      border-top:1px solid var(--border); text-align:center; padding:28px;
      font-family:'JetBrains Mono',monospace; font-size:.75rem; color:var(--muted);
    }
    footer a { color:var(--accent-hi); text-decoration:none; }

    @media(max-width:600px){
      article { padding:32px 16px 64px; }
      .hero-image-wrap img { height:220px; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <a href="../index.html" class="logo">
      <img src="logo.png" alt="Logo" class="main-logo" style="height: 32px; object-fit: contain;" />
    </a>
    <a href="index.html" class="back-link">
      ← All Changelogs
    </a>
  </div>
</header>

<!-- HERO IMAGE: ustaw src lub usuń ten blok -->
<div class="hero-image-wrap" id="hero-wrap">
  <!-- generator wstawi tutaj obraz albo placeholder -->
</div>

<article>
  <div class="article-meta" id="article-meta">
    <!-- generator wstawi wersję, datę, tagi -->
  </div>

  <h1 class="article-title" id="article-title">Update Name</h1>
  <p class="article-excerpt" id="article-excerpt">A short description of this update.</p>

  <div class="cl-content" id="cl-content">
    <!-- TREŚĆ CHANGELOGU — pisz tu normalnie -->

  </div>

  <!-- Nawigacja prev/next — generator uzupełni automatycznie -->
  <nav class="version-nav" id="version-nav"></nav>
</article>

<footer>
  <a href="index.html">← All Changelogs</a>
</footer>

<script>
/* Meta tego changelogu — EDYTUJ TU */
const CHANGELOG_META = {
  version: "{{VERSION}}",
  date: "{{DATE}}",          // RRRR-MM-DD
  title: "{{TITLE}}",
  excerpt: "{{EXCERPT}}",
  tags: [/* "feat","fix","perf","break","patch" */],
  heroImage: "",             // ścieżka do obrazu nagłówkowego lub ""
  prevVersion: "",           // np. "1.1.0" lub ""
  nextVersion: "",           // np. "1.3.0" lub ""
};

/* ── render meta ─────────────────────────────── */
(function(){
  const m = CHANGELOG_META;

  // hero
  const hw = document.getElementById('hero-wrap');
  if (m.heroImage) {
    hw.innerHTML = `<img src="${m.heroImage}" alt="Hero v${m.version}" />`;
  } else {
    hw.outerHTML = `<div class="hero-gradient"><div class="hero-gradient-inner">v${m.version}</div></div>`;
  }

  // meta bar
  const tagMap = {fix:'Bug Fixes',feat:'News',perf:'Performance',break:'Important',patch:'Patch'};
  const tags = (m.tags||[]).map(t=>`<span class="tag tag-${t}">${tagMap[t]||t}</span>`).join('');
  document.getElementById('article-meta').innerHTML =
    `<span class="art-version">v${m.version}</span>
     <span class="art-date">${m.date}</span>
     ${tags}`;

  // title & excerpt
  if (m.title) document.getElementById('article-title').textContent = m.title;
  if (m.excerpt) document.getElementById('article-excerpt').textContent = m.excerpt;
  document.title = `v${m.version}`;

  // version nav
  const nav = document.getElementById('version-nav');
  let html = '';
  if (m.prevVersion)
    html += `<a class="ver-btn prev" href="${m.prevVersion}.html">
      <span class="vb-label">← Poprzednia</span>
      <span class="vb-ver">v${m.prevVersion}</span>
    </a>`;
  if (m.nextVersion)
    html += `<a class="ver-btn next" href="${m.nextVersion}.html">
      <span class="vb-label">Następna →</span>
      <span class="vb-ver">v${m.nextVersion}</span>
    </a>`;
  if (!html) nav.style.display='none';
  else nav.innerHTML = html;
})();
</script>

</body>
</html>
