<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Changelog Not Found</title>
  <link rel="icon" type="image/x-icon" href="icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d0f14;
      --text: #e2e8f0;
      --muted: #64748b;
      --muted-hi: #94a3b8;
      --accent: #7c3aed;
      --accent-hi: #a855f7;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    
    .container {
      text-align: center;
      padding: 40px;
      position: relative;
      z-index: 10;
    }
    
    .error-code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 8rem;
      font-weight: 700;
      line-height: 1;
      margin-bottom: 20px;
      background: linear-gradient(135deg, var(--accent-hi), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 10px 40px rgba(124, 58, 237, 0.3);
      letter-spacing: -0.05em;
    }
    
    .error-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 16px;
      color: #fff;
    }
    
    .error-desc {
      font-size: 1.1rem;
      color: var(--muted-hi);
      max-width: 460px;
      margin: 0 auto 40px auto;
      line-height: 1.7;
    }
    
    .btn-home {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 8px;
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      font-weight: 500;
      transition: all 0.3s ease;
      box-shadow: 0 4px 20px rgba(124, 58, 237, 0.25);
    }
    
    .btn-home:hover {
      background: var(--accent-hi);
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(124, 58, 237, 0.4);
    }
    
    /* Background Glow Effects */
    .glow-bg {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(124,58,237,0.08) 0%, rgba(13,15,20,0) 70%);
      z-index: 1;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="glow-bg"></div>

  <div class="container">
    <div class="error-code">404</div>
    <h1 class="error-title">Page Not Found</h1>
    <p class="error-desc">
      Oops!! It seems the article or changelog you are looking for has been moved, deleted, or never existed in the first place.
    </p>
    <a href="/changelogs/" class="btn-home">
      <span>Return to Homepage</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12h14M12 5l7 7-7 7"/>
      </svg>
    </a>
  </div>

</body>
</html>
