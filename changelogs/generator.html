<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Generator Changelogów</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:        #0d0f14;
      --bg-card:   #12151e;
      --bg-panel:  #0f111a;
      --border:    #1f2435;
      --accent:    #7c3aed;
      --accent-hi: #a855f7;
      --accent-glow: rgba(124,58,237,.35);
      --text:      #e2e8f0;
      --muted:     #64748b;
      --muted-hi:  #94a3b8;
      --tag-bg:    rgba(124,58,237,.15);
      --success:   #10b981;
      --danger:    #ef4444;
      --warning:   #f59e0b;
    }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Inter', sans-serif; font-size: 14px; line-height: 1.6;
      min-height: 100vh;
      overflow-y: hidden; /* Main window won't scroll, panels will */
    }

    /* ─── HEADER ─── */
    header {
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 200;
      background: rgba(13,15,20,.9); backdrop-filter: blur(12px);
    }
    .header-inner {
      max-width: 1400px; margin: 0 auto; padding: 0 24px; height: 56px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .logo {
      font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 1rem;
      color: var(--text); text-decoration: none; display: flex; align-items: center; gap: 8px;
    }
    .logo-tag { font-family: 'JetBrains Mono', monospace; font-size: .7rem; color: var(--accent-hi); margin-left: 2px; }
    .header-actions { display: flex; gap: 8px; }
    .btn {
      padding: 7px 14px; border-radius: 7px; font-size: .82rem; font-family: 'Inter', sans-serif;
      cursor: pointer; border: 1px solid var(--border); transition: all .2s;
      display: flex; align-items: center; gap: 6px;
    }
    .btn-ghost { background: transparent; color: var(--muted-hi); }
    .btn-ghost:hover { border-color: var(--accent); color: var(--text); }
    .btn-accent { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn-accent:hover { background: var(--accent-hi); border-color: var(--accent-hi); }

    /* ─── LAYOUT ─── */
    .workspace {
      display: grid; grid-template-columns: 380px 1fr;
      max-width: 1400px; margin: 0 auto;
      height: calc(100vh - 56px);
    }
    @media(max-width: 900px) {
      .workspace { grid-template-columns: 1fr; height: calc(100vh - 104px); }
      .mobile-tabs { display: flex; }
      .preview-panel { display: none; }
      .workspace.show-preview .form-panel { display: none; }
      .workspace.show-preview .preview-panel { display: block; }
      body { overflow-y: auto; }
    }
    
    .mobile-tabs {
      display: none; background: var(--bg-card); border-bottom: 1px solid var(--border);
      position: sticky; top: 56px; z-index: 150;
    }
    .mobile-tab {
      flex: 1; padding: 12px; text-align: center; font-family: 'Space Grotesk', sans-serif;
      font-weight: 600; cursor: pointer; color: var(--muted-hi);
      border-bottom: 2px solid transparent; transition: all .2s;
    }
    .mobile-tab.active {
      color: var(--accent-hi); border-bottom-color: var(--accent); background: rgba(124,58,237,.05);
    }

    /* ─── LEFT PANEL ─── */
    .form-panel {
      border-right: 1px solid var(--border);
      padding: 24px; overflow-y: auto;
      height: 100%;
      /* NO flex column to prevent shrinking issues */
    }

    /* sections */
    .form-section {
      border: 1px solid var(--border); border-radius: 10px;
      overflow: hidden; margin-bottom: 16px;
      background: var(--bg-card);
    }
    .form-section-header {
      padding: 12px 16px; background: rgba(255,255,255,.02);
      display: flex; align-items: center; justify-content: space-between;
      cursor: pointer; user-select: none;
      font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: .88rem;
    }
    .form-section-header:hover { background: rgba(255,255,255,.04); }
    .fs-arrow { transition: transform .2s; color: var(--muted); }
    .form-section.open .fs-arrow { transform: rotate(180deg); }
    .form-section-body { padding: 16px; display: none; border-top: 1px solid var(--border); }
    .form-section.open .form-section-body { display: block; }

    /* fields */
    label { display: block; font-size: .78rem; color: var(--muted-hi); margin-bottom: 6px; font-weight: 500; }
    .field { margin-bottom: 16px; }
    input[type=text], input[type=date], textarea, select {
      width: 100%; padding: 10px 12px;
      background: var(--bg); border: 1px solid var(--border); border-radius: 7px;
      color: var(--text); font-family: 'Inter', sans-serif; font-size: .85rem;
      outline: none; transition: border-color .2s, box-shadow .2s;
    }
    input:focus, textarea:focus, select:focus {
      border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow);
    }
    textarea { resize: vertical; min-height: 80px; }
    select option { background: var(--bg-card); }

    /* tags checkboxes */
    .tag-grid { display: flex; flex-wrap: wrap; gap: 8px; }
    .tag-cb { display: none; }
    .tag-label {
      padding: 5px 12px; border-radius: 6px; border: 1px solid var(--border);
      font-size: .75rem; cursor: pointer; transition: all .2s; color: var(--muted-hi);
      user-select: none;
    }
    .tag-cb:checked + .tag-label { border-color: var(--accent); color: var(--accent-hi); background: var(--tag-bg); }

    /* blocks list */
    .blocks-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
    .block-item {
      background: var(--bg); border: 1px solid var(--border); border-radius: 8px; overflow: hidden;
    }
    .block-header {
      padding: 10px 14px; display: flex; align-items: center; justify-content: space-between;
      cursor: pointer;
    }
    .block-header:hover { background: rgba(255,255,255,.03); }
    .block-type-badge {
      font-family: 'JetBrains Mono', monospace; font-size: .68rem;
      padding: 3px 8px; border-radius: 4px; font-weight: 600;
    }
    .block-inner { padding: 12px 14px; border-top: 1px solid var(--border); display: none; }
    .block-item.open .block-inner { display: block; }
    .block-actions { display: flex; gap: 4px; }
    .icon-btn {
      width: 28px; height: 28px; border-radius: 6px; border: 1px solid var(--border);
      background: transparent; color: var(--muted); cursor: pointer;
      display: flex; align-items: center; justify-content: center; font-size: .85rem;
      transition: all .2s;
    }
    .icon-btn:hover { border-color: var(--accent-hi); color: var(--text); }
    .icon-btn.del:hover { border-color: var(--danger); color: var(--danger); }

    .add-block-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .add-block-btn {
      padding: 10px 8px; border-radius: 8px; border: 1px dashed var(--border);
      background: transparent; color: var(--muted-hi); cursor: pointer;
      font-size: .75rem; font-family: 'Inter', sans-serif;
      transition: all .2s; text-align: center;
    }
    .add-block-btn:hover { border-color: var(--accent); color: var(--accent-hi); background: var(--tag-bg); }
    .add-block-btn .ab-icon { font-size: 1.2rem; display: block; margin-bottom: 4px; }

    /* image upload */
    .img-drop {
      border: 2px dashed var(--border); border-radius: 8px; padding: 24px;
      text-align: center; color: var(--muted); cursor: pointer; transition: border-color .2s;
      font-size: .82rem; background: var(--bg);
    }
    .img-drop:hover, .img-drop.drag { border-color: var(--accent); color: var(--muted-hi); }
    .img-preview { max-width: 100%; border-radius: 6px; margin-top: 12px; border: 1px solid var(--border); }

    /* ─── RIGHT PANEL (PREVIEW) ─── */
    .preview-panel {
      padding: 32px 48px; overflow-y: auto;
      height: 100%; background: var(--bg-panel);
    }
    .preview-container {
      max-width: 800px; margin: 0 auto;
    }
    .preview-label {
      font-family: 'JetBrains Mono', monospace; font-size: .75rem; color: var(--muted);
      letter-spacing: .1em; text-transform: uppercase; margin-bottom: 24px;
      display: flex; align-items: center; gap: 12px;
    }
    .preview-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    /* preview styles */
    .pv-hero { width: 100%; height: 220px; object-fit: cover; border-radius: 12px; margin-bottom: 24px; border: 1px solid var(--border); }
    .pv-hero-ph {
      width: 100%; height: 160px; border-radius: 12px; margin-bottom: 24px; border: 1px solid var(--border);
      background: linear-gradient(135deg, #1a1028, #0d0f14);
      display: flex; align-items: center; justify-content: center;
    }
    .pv-hero-ph-text { font-family: 'JetBrains Mono', monospace; font-size: 2.5rem; color: var(--accent); opacity: .3; }
    .pv-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
    .pv-version { font-family: 'JetBrains Mono', monospace; font-size: .88rem; font-weight: 600; color: var(--accent-hi); background: var(--tag-bg); padding: 3px 10px; border-radius: 6px; }
    .pv-date { font-family: 'JetBrains Mono', monospace; font-size: .8rem; color: var(--muted); }
    .pv-tag { font-family: 'Inter', sans-serif; font-size: .75rem; font-weight: 500; padding: 2px 8px; border-radius: 4px; border: 1px solid var(--border); color: var(--muted-hi); }
    .pv-title { font-family: 'Space Grotesk', sans-serif; font-size: 1.8rem; font-weight: 700; line-height: 1.2; margin-bottom: 8px; }
    .pv-author { font-family: 'JetBrains Mono', monospace; font-size: .85rem; color: var(--muted); margin-bottom: 16px; }
    .pv-excerpt { font-size: .95rem; color: var(--muted-hi); border-left: 4px solid var(--accent); padding-left: 16px; margin-bottom: 32px; line-height: 1.7; }
    
    .pv-content h2 { font-family: 'Space Grotesk', sans-serif; font-size: 1.25rem; font-weight: 600; margin: 32px 0 12px; display: flex; align-items: center; gap: 10px; }
    .pv-content h2::before { content: '#'; font-family: 'JetBrains Mono', monospace; font-size: .9rem; color: var(--accent); opacity: .7; }
    .pv-content p { font-size: .95rem; color: var(--text); margin-bottom: 14px; line-height: 1.7; }
    .pv-content ul { list-style: none; padding: 0; margin-bottom: 16px; }
    .pv-content ul li { padding: 4px 0 4px 22px; position: relative; font-size: .95rem; color: var(--text); line-height: 1.6; }
    .pv-content ul li::before { content: '→'; position: absolute; left: 0; color: var(--accent); }
    .pv-content img { max-width: 100%; border-radius: 10px; border: 1px solid var(--border); margin: 16px 0; }
    .pv-content table { width: 100%; border-collapse: collapse; font-size: .9rem; margin: 16px 0; }
    .pv-content th { padding: 10px; font-family: 'JetBrains Mono', monospace; font-size: .75rem; color: var(--accent-hi); text-transform: uppercase; border-bottom: 1px solid var(--border); text-align: left; }
    .pv-content td { padding: 10px; border-bottom: 1px solid rgba(31,36,53,.5); color: var(--text); }
    
    .change-block { border-left: 3px solid; padding: 12px 16px; border-radius: 0 8px 8px 0; background: rgba(255,255,255,.02); margin: 10px 0; }
    .change-block.feat { border-color: var(--success); }
    .change-block.fix { border-color: var(--danger); }
    .change-block.perf { border-color: var(--warning); }
    .change-block.break { border-color: #dc2626; }
    .change-block.info { border-color: var(--accent); }
    .cb-label { font-family: 'JetBrains Mono', monospace; font-size: .7rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 4px; }
    .change-block.feat .cb-label { color: #6ee7b7; }
    .change-block.fix .cb-label { color: #fca5a5; }
    .change-block.perf .cb-label { color: #fcd34d; }
    .change-block.break .cb-label { color: #f87171; }
    .change-block.info .cb-label { color: var(--accent-hi); }
    .change-block p { margin: 0; font-size: .9rem; }
    
    .callout { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin: 16px 0; display: flex; gap: 12px; }
    .callout-icon { flex-shrink: 0; font-size: 1.2rem; }
    .callout p { margin: 0; font-size: .9rem; color: var(--muted-hi); line-height: 1.6; }
    
    .pv-content pre { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 16px; overflow-x: auto; margin: 16px 0; font-family: 'JetBrains Mono', monospace; font-size: .85rem; color: var(--muted-hi); }
    hr.pv-hr { border: none; border-top: 1px solid var(--border); margin: 32px 0; }
    .pv-content iframe { width: 100%; aspect-ratio: 16/9; border-radius: 12px; border: 1px solid var(--border); margin: 20px 0; }
    .community-box { border: 1px dashed var(--accent); background: var(--tag-bg); border-radius: 10px; padding: 24px; margin: 20px 0; text-align: center; }
    .community-box h4 { font-family: 'Space Grotesk', sans-serif; font-size: 1.2rem; color: var(--accent-hi); margin-bottom: 10px; }
    .community-box p { font-size: .95rem; margin: 0; color: var(--text); }

    /* ─── TOAST ─── */
    .toast {
      position: fixed; bottom: 24px; right: 24px; z-index: 9999;
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 8px; padding: 14px 20px; font-size: .9rem; color: var(--text);
      box-shadow: 0 8px 32px rgba(0,0,0,.5);
      opacity: 0; transform: translateY(12px);
      transition: all .3s; pointer-events: none; max-width: 360px;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.success { border-color: var(--success); }
    .toast.error { border-color: var(--danger); }

    /* ─── MODALS ─── */
    .code-modal-bg {
      position: fixed; inset: 0; background: rgba(0,0,0,.8); z-index: 500;
      display: none; align-items: center; justify-content: center; padding: 24px;
      backdrop-filter: blur(4px);
    }
    .code-modal-bg.open { display: flex; }
    .code-modal {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;
      max-width: 900px; width: 100%; max-height: 85vh; display: flex; flex-direction: column;
      box-shadow: 0 20px 60px rgba(0,0,0,.5);
    }
    .code-modal-header { padding: 18px 24px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); }
    .code-modal-title { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 1.1rem; }
    .code-modal-body { flex: 1; overflow-y: auto; padding: 24px; }
    .code-modal-body pre { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 20px; overflow-x: auto; font-family: 'JetBrains Mono', monospace; font-size: .82rem; color: var(--muted-hi); white-space: pre; }
    .code-modal-footer { padding: 18px 24px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 10px; }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <a href="../index.html" class="logo">
      <img src="logo.png" alt="Logo" style="height: 32px; object-fit: contain; border-radius: 4px;" onerror="this.style.display='none'" />
      <span class="logo-tag">/ generator v2</span>
    </a>
    <div class="header-actions">
      <button class="btn btn-ghost" id="btn-data-js">
        JS Data
      </button>
      <button class="btn btn-ghost" id="btn-preview-code">
        HTML
      </button>
      <button class="btn btn-ghost" id="btn-export-md">
        Markdown
      </button>
      <button class="btn btn-accent" id="btn-download">
        Pobierz plik
      </button>
    </div>
  </div>
</header>

<div class="mobile-tabs">
  <div class="mobile-tab active" data-target="form">Formularz</div>
  <div class="mobile-tab" data-target="preview">Podgląd</div>
</div>

<div class="workspace" id="workspace">
  <!-- ═══════════ FORM PANEL ═══════════ -->
  <div class="form-panel">
    <!-- META -->
    <div class="form-section open" id="sec-meta">
      <div class="form-section-header" onclick="this.parentElement.classList.toggle('open')">
        <span>📋 Informacje podstawowe</span>
        <span class="fs-arrow">▼</span>
      </div>
      <div class="form-section-body">
        <div class="field">
          <label>Numer wersji *</label>
          <input type="text" id="f-version" placeholder="np. 1.2.0" oninput="updatePreview()" />
        </div>
        <div class="field">
          <label>Tytuł aktualizacji *</label>
          <input type="text" id="f-title" placeholder="np. Wielka Aktualizacja" oninput="updatePreview()" />
        </div>
        <div class="field">
          <label>Autor</label>
          <input type="text" id="f-author" placeholder="np. Zespół Dev" oninput="updatePreview()" />
        </div>
        <div class="field">
          <label>Data publikacji</label>
          <input type="date" id="f-date" oninput="updatePreview()" />
        </div>
        <div class="field">
          <label>Krótki opis</label>
          <textarea id="f-excerpt" placeholder="Kilka zdań o tej wersji..." oninput="updatePreview()"></textarea>
        </div>
        <div class="field">
          <label>Tagi</label>
          <div class="tag-grid">
            <input type="checkbox" class="tag-cb" id="t-feat" value="feat" onchange="updatePreview()"><label class="tag-label" for="t-feat">✨ Nowość</label>
            <input type="checkbox" class="tag-cb" id="t-fix" value="fix" onchange="updatePreview()"><label class="tag-label" for="t-fix">🐛 Poprawka</label>
            <input type="checkbox" class="tag-cb" id="t-perf" value="perf" onchange="updatePreview()"><label class="tag-label" for="t-perf">⚡ Wydajność</label>
            <input type="checkbox" class="tag-cb" id="t-break" value="break" onchange="updatePreview()"><label class="tag-label" for="t-break">💥 Breaking</label>
            <input type="checkbox" class="tag-cb" id="t-patch" value="patch" onchange="updatePreview()"><label class="tag-label" for="t-patch">🔧 Patch</label>
            <input type="checkbox" class="tag-cb" id="t-event" value="event" onchange="updatePreview()"><label class="tag-label" for="t-event">🎉 Event</label>
          </div>
        </div>
        <div class="field">
          <label>Poprzednia wersja (link)</label>
          <input type="text" id="f-prev" placeholder="np. 1.1.0" oninput="updatePreview()" />
        </div>
        <div class="field">
          <label>Następna wersja (link)</label>
          <input type="text" id="f-next" placeholder="np. 1.3.0" oninput="updatePreview()" />
        </div>
      </div>
    </div>

    <!-- HERO IMAGE -->
    <div class="form-section open" id="sec-hero">
      <div class="form-section-header" onclick="this.parentElement.classList.toggle('open')">
        <span>🖼️ Obraz nagłówkowy</span>
        <span class="fs-arrow">▼</span>
      </div>
      <div class="form-section-body">
        <div class="field">
          <label>Ścieżka URL / plik</label>
          <input type="text" id="f-hero-path" placeholder="assets/hero.jpg" oninput="updatePreview()" />
        </div>
        <div class="img-drop" id="img-drop">
          <div>📁 Kliknij lub przeciągnij obraz aby zamienić na Base64</div>
          <img id="hero-preview" class="img-preview" style="display:none" />
        </div>
        <input type="file" id="hero-file" accept="image/*" style="display:none" />
      </div>
    </div>

    <!-- CONTENT BLOCKS -->
    <div class="form-section open" id="sec-content">
      <div class="form-section-header" onclick="this.parentElement.classList.toggle('open')">
        <span>📝 Treść changelogu</span>
        <span class="fs-arrow">▼</span>
      </div>
      <div class="form-section-body">
        <div class="blocks-list" id="blocks-list"></div>
        <div class="add-block-grid">
          <button class="add-block-btn" onclick="addBlock('heading')"><span class="ab-icon">H</span>Nagłówek</button>
          <button class="add-block-btn" onclick="addBlock('paragraph')"><span class="ab-icon">¶</span>Paragraf</button>
          <button class="add-block-btn" onclick="addBlock('list')"><span class="ab-icon">≡</span>Lista</button>
          <button class="add-block-btn" onclick="addBlock('change')"><span class="ab-icon">⊞</span>Zmiana</button>
          <button class="add-block-btn" onclick="addBlock('image')"><span class="ab-icon">🖼</span>Obraz</button>
          <button class="add-block-btn" onclick="addBlock('table')"><span class="ab-icon">⊟</span>Tabela</button>
          <button class="add-block-btn" onclick="addBlock('callout')"><span class="ab-icon">💡</span>Callout</button>
          <button class="add-block-btn" onclick="addBlock('code')"><span class="ab-icon">&lt;/&gt;</span>Kod</button>
          <button class="add-block-btn" onclick="addBlock('divider')"><span class="ab-icon">─</span>Separator</button>
          <button class="add-block-btn" onclick="addBlock('video')"><span class="ab-icon">▶️</span>Wideo</button>
          <button class="add-block-btn" onclick="addBlock('community')"><span class="ab-icon">👥</span>Pytanie</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ═══════════ PREVIEW PANEL ═══════════ -->
  <div class="preview-panel">
    <div class="preview-container">
      <div class="preview-label">Podgląd na żywo</div>
      <div id="preview-area"></div>
    </div>
  </div>
</div>

<!-- ─── MODALS ─── -->
<div class="code-modal-bg" id="code-modal">
  <div class="code-modal">
    <div class="code-modal-header">
      <div class="code-modal-title">HTML</div>
      <button class="btn btn-ghost" onclick="document.getElementById('code-modal').classList.remove('open')">✕</button>
    </div>
    <div class="code-modal-body"><pre id="code-output"></pre></div>
    <div class="code-modal-footer">
      <button class="btn btn-accent" onclick="copyText('code-output')">Kopiuj do schowka</button>
    </div>
  </div>
</div>

<div class="code-modal-bg" id="data-modal">
  <div class="code-modal">
    <div class="code-modal-header">
      <div class="code-modal-title">changelogs-data.js</div>
      <button class="btn btn-ghost" onclick="document.getElementById('data-modal').classList.remove('open')">✕</button>
    </div>
    <div class="code-modal-body">
      <label>Wklej obecny changelogs-data.js by zaktualizować (opcjonalnie):</label>
      <textarea id="existing-data" style="margin-bottom: 12px; height: 100px; padding: 12px; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 8px; width: 100%; font-family: monospace;" placeholder="// Wklej stary kod..."></textarea>
      <button class="btn btn-ghost" onclick="generateDataJs()" style="width:100%; margin-bottom: 16px;">Generuj nowy kod</button>
      <pre id="data-output" style="background:var(--bg); padding:16px; border-radius:8px; border:1px solid var(--border); overflow-x:auto; min-height: 50px;"></pre>
    </div>
    <div class="code-modal-footer">
      <button class="btn btn-accent" onclick="copyText('data-output')">Kopiuj do schowka</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- Safe script zone -->
<script>
let blocks = [];
let blockId = 0;
let heroBase64 = '';

const BLOCKS_DEF = {
  heading: { text: 'Nowa sekcja' },
  paragraph: { text: 'Wpisz tekst...' },
  list: { items: ['Zmiana 1', 'Zmiana 2'] },
  change: { kind: 'feat', label: '', text: 'Dodano nową funkcję' },
  image: { src: '', alt: '', caption: '' },
  table: { headers: ['Kol 1', 'Kol 2'], rows: [['Dane 1', 'Dane 2']] },
  callout: { icon: '💡', text: 'Ważna informacja' },
  code: { lang: '', text: 'console.log("Hello");' },
  divider: {},
  video: { url: '' },
  community: { title: 'Pytanie do graczy', text: 'Co sądzicie o aktualizacji?' }
};

const BLOCKS_UI = {
  heading: { icon: 'H', color: 'rgba(124,58,237,.25)' },
  paragraph: { icon: '¶', color: 'rgba(100,116,139,.15)' },
  list: { icon: '≡', color: 'rgba(16,185,129,.15)' },
  change: { icon: '⊞', color: 'rgba(245,158,11,.15)' },
  image: { icon: '🖼', color: 'rgba(59,130,246,.15)' },
  table: { icon: '⊟', color: 'rgba(14,165,233,.15)' },
  callout: { icon: '💡', color: 'rgba(168,85,247,.15)' },
  code: { icon: '</>', color: 'rgba(100,116,139,.2)' },
  divider: { icon: '─', color: 'rgba(100,116,139,.1)' },
  video: { icon: '▶️', color: 'rgba(239,68,68,.15)' },
  community: { icon: '👥', color: 'rgba(168,85,247,.2)' }
};

// Utils
const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const nl2br = s => String(s||'').replace(/\n/g,'<br>');

function showToast(msg, type='success') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show ' + type;
  setTimeout(() => el.classList.remove('show'), 3000);
}

// Blocks Management
window.addBlock = (type) => {
  blocks.push({ id: ++blockId, type, ...JSON.parse(JSON.stringify(BLOCKS_DEF[type])) });
  renderBlocks();
  updatePreview();
}
window.removeBlock = (id) => { blocks = blocks.filter(b => b.id !== id); renderBlocks(); updatePreview(); }
window.moveBlock = (id, dir) => {
  const i = blocks.findIndex(b => b.id === id);
  if (i < 0 || i+dir < 0 || i+dir >= blocks.length) return;
  [blocks[i], blocks[i+dir]] = [blocks[i+dir], blocks[i]];
  renderBlocks(); updatePreview();
}
window.updateBlock = (id, key, val) => {
  const b = blocks.find(b => b.id === id);
  if (b) { b[key] = val; updatePreview(); }
}

function renderBlocks() {
  const list = document.getElementById('blocks-list');
  list.innerHTML = blocks.map(b => {
    const ui = BLOCKS_UI[b.type] || { icon: '?', color: 'transparent' };
    let inner = '';
    
    if (b.type === 'heading') inner = '<label>Tekst</label><input type="text" value="' + esc(b.text) + '" oninput="updateBlock(' + b.id + ',\'text\',this.value)" />';
    else if (b.type === 'paragraph') inner = '<label>Tekst</label><textarea oninput="updateBlock(' + b.id + ',\'text\',this.value)">' + esc(b.text) + '</textarea>';
    else if (b.type === 'list') inner = '<label>Elementy (nowa linia = nowy element)</label><textarea oninput="updateBlock(' + b.id + ',\'items\',this.value.split(\'\\n\'))">' + esc((b.items||[]).join('\n')) + '</textarea>';
    else if (b.type === 'change') inner = '<label>Typ zmiany</label><select onchange="updateBlock(' + b.id + ',\'kind\',this.value)">' + ['feat','fix','perf','break','info'].map(k=>'<option value="' + k + '" ' + (b.kind===k?'selected':'') + '>' + k.toUpperCase() + '</option>').join('') + '</select><label style="margin-top:8px">Etykieta</label><input type="text" value="' + esc(b.label||'') + '" oninput="updateBlock(' + b.id + ',\'label\',this.value)" /><label style="margin-top:8px">Opis</label><textarea oninput="updateBlock(' + b.id + ',\'text\',this.value)">' + esc(b.text) + '</textarea>';
    else if (b.type === 'image') inner = '<label>Ścieżka</label><input type="text" value="' + esc(b.src) + '" oninput="updateBlock(' + b.id + ',\'src\',this.value)" /><label style="margin-top:8px">Alt text</label><input type="text" value="' + esc(b.alt) + '" oninput="updateBlock(' + b.id + ',\'alt\',this.value)" /><label style="margin-top:8px">Podpis</label><input type="text" value="' + esc(b.caption) + '" oninput="updateBlock(' + b.id + ',\'caption\',this.value)" />';
    else if (b.type === 'table') inner = '<label>Nagłówki (oddzielone |)</label><input type="text" value="' + esc((b.headers||[]).join(' | ')) + '" oninput="updateBlock(' + b.id + ',\'headers\',this.value.split(\'|\').map(s=>s.trim()))" /><label style="margin-top:8px">Wiersze (oddzielone |, enter = nowy wiersz)</label><textarea oninput="updateBlock(' + b.id + ',\'rows\',this.value.split(\'\\n\').filter(r=>r.trim()).map(r=>r.split(\'|\').map(s=>s.trim())))">' + esc((b.rows||[]).map(r=>r.join(' | ')).join('\n')) + '</textarea>';
    else if (b.type === 'callout') inner = '<label>Ikona</label><input type="text" value="' + esc(b.icon) + '" style="width:60px" oninput="updateBlock(' + b.id + ',\'icon\',this.value)" /><label style="margin-top:8px">Tekst</label><textarea oninput="updateBlock(' + b.id + ',\'text\',this.value)">' + esc(b.text) + '</textarea>';
    else if (b.type === 'code') inner = '<label>Język</label><input type="text" value="' + esc(b.lang) + '" oninput="updateBlock(' + b.id + ',\'lang\',this.value)" /><label style="margin-top:8px">Kod</label><textarea style="font-family:monospace" oninput="updateBlock(' + b.id + ',\'text\',this.value)">' + esc(b.text) + '</textarea>';
    else if (b.type === 'divider') inner = '<p style="font-size: .8rem; color: var(--muted)">Brak opcji konfiguracyjnych.</p>';
    else if (b.type === 'video') inner = '<label>Link YouTube</label><input type="text" value="' + esc(b.url) + '" oninput="updateBlock(' + b.id + ',\'url\',this.value)" />';
    else if (b.type === 'community') inner = '<label>Tytuł</label><input type="text" value="' + esc(b.title) + '" oninput="updateBlock(' + b.id + ',\'title\',this.value)" /><label style="margin-top:8px">Treść</label><textarea oninput="updateBlock(' + b.id + ',\'text\',this.value)">' + esc(b.text) + '</textarea>';

    return '<div class="block-item open"><div class="block-header" onclick="this.parentElement.classList.toggle(\'open\')"><div style="display:flex;align-items:center;gap:8px"><span class="block-type-badge" style="background:' + ui.color + ';color:var(--text)">' + ui.icon + '</span><span style="font-weight:500">' + b.type + '</span></div><div class="block-actions" onclick="event.stopPropagation()"><button class="icon-btn" onclick="moveBlock(' + b.id + ',-1)">↑</button><button class="icon-btn" onclick="moveBlock(' + b.id + ',1)">↓</button><button class="icon-btn del" onclick="removeBlock(' + b.id + ')">✕</button></div></div><div class="block-inner">' + inner + '</div></div>';
  }).join('');
}

// Data gathering
function getFormData() {
  return {
    version: document.getElementById('f-version').value.trim(),
    title: document.getElementById('f-title').value.trim(),
    author: document.getElementById('f-author').value.trim(),
    date: document.getElementById('f-date').value,
    excerpt: document.getElementById('f-excerpt').value.trim(),
    tags: Array.from(document.querySelectorAll('.tag-cb:checked')).map(cb => cb.value),
    prev: document.getElementById('f-prev').value.trim(),
    next: document.getElementById('f-next').value.trim(),
    hero: heroBase64 || document.getElementById('f-hero-path').value.trim()
  };
}

// Generate HTML safe string
function blockToHtml(b) {
  if (b.type === 'heading') return '<h2>' + esc(b.text) + '</h2>';
  if (b.type === 'paragraph') return '<p>' + nl2br(esc(b.text)) + '</p>';
  if (b.type === 'list') return '<ul>' + (b.items||[]).map(i=>'<li>'+esc(i)+'</li>').join('') + '</ul>';
  if (b.type === 'change') {
    const l = b.label || b.kind.toUpperCase();
    return '<div class="change-block ' + b.kind + '"><div class="cb-label">' + esc(l) + '</div><p>' + nl2br(esc(b.text)) + '</p></div>';
  }
  if (b.type === 'image') return '<img src="' + esc(b.src) + '" alt="' + esc(b.alt) + '" />' + (b.caption ? '<div class="img-caption">' + esc(b.caption) + '</div>' : '');
  if (b.type === 'table') {
    const th = (b.headers||[]).map(h=>'<th>'+esc(h)+'</th>').join('');
    const tr = (b.rows||[]).map(r=>'<tr>'+r.map(c=>'<td>'+esc(c)+'</td>').join('')+'</tr>').join('');
    return '<table><thead><tr>' + th + '</tr></thead><tbody>' + tr + '</tbody></table>';
  }
  if (b.type === 'callout') return '<div class="callout"><span class="callout-icon">' + esc(b.icon) + '</span><p>' + nl2br(esc(b.text)) + '</p></div>';
  if (b.type === 'code') return '<pre><code>' + esc(b.text) + '</code></pre>';
  if (b.type === 'divider') return '<hr class="pv-hr" />';
  if (b.type === 'video') {
    const m = (b.url||'').match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([^&?\n]+)/);
    return m ? '<iframe src="https://www.youtube.com/embed/' + m[1] + '" allowfullscreen></iframe>' : '';
  }
  if (b.type === 'community') return '<div class="community-box"><h4>' + esc(b.title) + '</h4><p>' + nl2br(esc(b.text)) + '</p></div>';
  return '';
}

// Live Preview
window.updatePreview = () => {
  const d = getFormData();
  const htmlBlocks = blocks.map(blockToHtml).join('\\n');
  const tagMap = { feat:'Nowość', fix:'Poprawka', perf:'Wydajność', break:'Breaking', patch:'Patch', event:'Event' };
  
  let tagsHtml = d.tags.map(t => '<span class="pv-tag">' + (tagMap[t]||t) + '</span>').join('');
  let heroHtml = d.hero 
    ? '<img class="pv-hero" src="' + esc(d.hero) + '" />'
    : '<div class="pv-hero-ph"><span class="pv-hero-ph-text">v' + esc(d.version) + '</span></div>';

  document.getElementById('preview-area').innerHTML = 
    heroHtml +
    '<div class="pv-meta">' +
      '<span class="pv-version">v' + esc(d.version || '?.?.?') + '</span>' +
      '<span class="pv-date">' + esc(d.date || 'Brak daty') + '</span>' +
      tagsHtml +
    '</div>' +
    '<div class="pv-title">' + esc(d.title || 'Tytuł Aktualizacji') + '</div>' +
    (d.author ? '<div class="pv-author">Autor: ' + esc(d.author) + '</div>' : '') +
    (d.excerpt ? '<div class="pv-excerpt">' + nl2br(esc(d.excerpt)) + '</div>' : '') +
    '<div class="pv-content">' + htmlBlocks + '</div>';
}

// Export Generators
function getFullHtml() {
  const d = getFormData();
  const htmlBlocks = blocks.map(blockToHtml).join('\\n    ');
  const fname = (d.version || 'changelog').replace(/[^a-zA-Z0-9.\\-]/g, '_');
  const tagMap = { feat:'Nowość', fix:'Poprawka', perf:'Wydajność', break:'Breaking', patch:'Patch', event:'Event' };
  
  let out = '<!DOCTYPE html>\\n<html lang="pl">\\n<head>\\n';
  out += '  <meta charset="UTF-8" />\\n';
  out += '  <title>v' + esc(d.version) + ' - Changelog</title>\\n';
  out += '  <link rel="stylesheet" href="changelog-style.css" />\\n';
  out += '</head>\\n<body>\\n\\n';
  out += '<header><a href="index.html">← Wróć do listy</a></header>\\n\\n';
  out += '<article>\\n';
  out += '  <h1>' + esc(d.title) + '</h1>\\n';
  out += '  <div class="content">\\n';
  out += '    ' + htmlBlocks + '\\n';
  out += '  </div>\\n';
  out += '</article>\\n\\n';
  out += '<' + '/body>\\n<' + '/html>';
  
  return { html: out, fname: fname + '.html' };
}

function generateMarkdown() {
  const d = getFormData();
  let md = '# v' + d.version + ' - ' + d.title + '\\n\\n';
  if (d.date) md += '**Data:** ' + d.date + '\\n';
  if (d.author) md += '**Autor:** ' + d.author + '\\n\\n';
  if (d.excerpt) md += '> ' + d.excerpt.replace(/\\n/g, '\\n> ') + '\\n\\n';

  blocks.forEach(b => {
    if (b.type==='heading') md += '## ' + b.text + '\\n\\n';
    if (b.type==='paragraph') md += b.text + '\\n\\n';
    if (b.type==='list') md += (b.items||[]).map(i=>'- '+i).join('\\n') + '\\n\\n';
    if (b.type==='change') md += '**[' + (b.label||b.kind.toUpperCase()) + ']** ' + b.text + '\\n\\n';
    if (b.type==='image') md += '![' + b.alt + '](' + b.src + ')\\n' + (b.caption ? '*'+b.caption+'*\\n\\n' : '\\n');
    if (b.type==='code') md += '```' + b.lang + '\\n' + b.text + '\\n```\\n\\n';
    if (b.type==='table') {
      md += '| ' + (b.headers||[]).join(' | ') + ' |\\n';
      md += '| ' + (b.headers||[]).map(()=>'---').join(' | ') + ' |\\n';
      (b.rows||[]).forEach(r => md += '| ' + r.join(' | ') + ' |\\n');
      md += '\\n';
    }
    if (b.type==='callout') md += '> **' + b.icon + '** ' + b.text.replace(/\\n/g, '\\n> ') + '\\n\\n';
    if (b.type==='divider') md += '---\\n\\n';
    if (b.type==='video') md += '[Wideo](' + b.url + ')\\n\\n';
    if (b.type==='community') md += '### ' + b.title + '\\n' + b.text + '\\n\\n';
  });
  return md.trim();
}

// Actions
document.getElementById('btn-preview-code').addEventListener('click', () => {
  document.getElementById('code-output').textContent = getFullHtml().html;
  document.getElementById('code-modal').classList.add('open');
});

document.getElementById('btn-export-md').addEventListener('click', () => {
  navigator.clipboard.writeText(generateMarkdown()).then(() => showToast('Skopiowano jako Markdown!'));
});

document.getElementById('btn-download').addEventListener('click', () => {
  const data = getFullHtml();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([data.html], {type:'text/html'}));
  a.download = data.fname;
  a.click();
  showToast('Pobrano plik: ' + data.fname);
});

document.getElementById('btn-data-js').addEventListener('click', () => {
  document.getElementById('data-modal').classList.add('open');
  document.getElementById('data-output').textContent = '';
});

window.generateDataJs = () => {
  const d = getFormData();
  const entry = {
    version: d.version, title: d.title, date: d.date,
    excerpt: d.excerpt, tags: d.tags, file: getFullHtml().fname,
    heroImage: d.hero ? '(obecny obraz)' : ''
  };
  
  let arr = [];
  const raw = document.getElementById('existing-data').value.trim();
  if (raw) {
    try { arr = new Function(raw + '\\nreturn typeof CHANGELOGS_DATA!=="undefined"?CHANGELOGS_DATA:[];')(); } 
    catch(e) { showToast('Błąd parsowania starego pliku JS', 'error'); return; }
  }
  
  const idx = arr.findIndex(x => x.version === d.version);
  if (idx >= 0) arr[idx] = entry; else arr.push(entry);
  arr.sort((a,b) => new Date(b.date||0) - new Date(a.date||0));
  
  document.getElementById('data-output').textContent = 'const CHANGELOGS_DATA = ' + JSON.stringify(arr, null, 2) + ';';
}

window.copyText = (id) => {
  const el = document.getElementById(id);
  if (el.textContent) {
    navigator.clipboard.writeText(el.textContent).then(() => showToast('Skopiowano do schowka!'));
  }
}

// Drag & Drop Hero
const imgDrop = document.getElementById('img-drop');
const fileInput = document.getElementById('hero-file');
imgDrop.addEventListener('click', () => fileInput.click());
imgDrop.addEventListener('dragover', e => { e.preventDefault(); imgDrop.classList.add('drag'); });
imgDrop.addEventListener('dragleave', () => imgDrop.classList.remove('drag'));
imgDrop.addEventListener('drop', e => {
  e.preventDefault(); imgDrop.classList.remove('drag');
  handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', e => handleFile(e.target.files[0]));

function handleFile(file) {
  if (!file || !file.type.startsWith('image/')) return;
  const r = new FileReader();
  r.onload = ev => {
    heroBase64 = ev.target.result;
    document.getElementById('f-hero-path').value = '';
    const preview = document.getElementById('hero-preview');
    preview.src = heroBase64; preview.style.display = 'block';
    updatePreview();
  };
  r.readAsDataURL(file);
}

// Mobile Tabs
document.querySelectorAll('.mobile-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.mobile-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    if (tab.dataset.target === 'preview') document.getElementById('workspace').classList.add('show-preview');
    else document.getElementById('workspace').classList.remove('show-preview');
  });
});

document.getElementById('f-date').value = new Date().toISOString().slice(0,10);
updatePreview();
</script>
</body>
